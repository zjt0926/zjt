{% extends "base.html" %}
{% block title %}CampusClaw 登录{% endblock %}
{% block content %}
<div class="pku-card" style="max-width:420px;margin:60px auto;">
  <h2>用户登录</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="pku-alert">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form method="post" action="/login">
    <div class="pku-form-group">
      <label>用户名</label>
      <input type="text" name="username" required autofocus>
    </div>
    <div class="pku-form-group">
      <label>密码</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="pku-btn">登录</button>
  </form>
</div>
{% endblock %}
