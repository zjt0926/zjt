<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CampusClaw{% endblock %}</title>
  <style>
    :root {
      --pku-crimson: #94070a;
      --pku-crimson-dark: #730407;
      --pku-crimson-light: #c41e1e;
      --pku-gold: #c8a063;
      --pku-gray-bg: #f5f5f5;
      --pku-gray-border: #ddd;
      --pku-text: #333;
      --pku-text-light: #666;
      --pku-white: #fff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: var(--pku-gray-bg);
      color: var(--pku-text);
      line-height: 1.6;
    }
    /* Header */
    .pku-header {
      background: linear-gradient(135deg, var(--pku-crimson) 0%, var(--pku-crimson-dark) 100%);
      color: var(--pku-white);
      padding: 0 0 0 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .pku-header-top {
      display: flex;
      align-items: center;
      padding: 18px 40px;
      gap: 16px;
    }
    .pku-logo {
      width: 44px; height: 44px;
      background: var(--pku-white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: var(--pku-crimson);
      flex-shrink: 0;
    }
    .pku-title-group h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .pku-title-group .subtitle {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 2px;
    }
    .pku-header-nav {
      margin-left: auto;
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .pku-header-nav a {
      color: var(--pku-white);
      text-decoration: none;
      font-size: 14px;
      opacity: 0.9;
      transition: opacity 0.2s;
    }
    .pku-header-nav a:hover { opacity: 1; }
    .pku-header-bar {
      height: 3px;
      background: var(--pku-gold);
    }
    /* Container */
    .pku-container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .pku-card {
      background: var(--pku-white);
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      padding: 32px;
      margin-bottom: 24px;
    }
    .pku-card h2 {
      font-size: 18px;
      color: var(--pku-crimson);
      border-left: 4px solid var(--pku-crimson);
      padding-left: 12px;
      margin-bottom: 20px;
    }
    /* Forms */
    .pku-form-group {
      margin-bottom: 18px;
    }
    .pku-form-group label {
      display: block;
      font-size: 14px;
      color: var(--pku-text-light);
      margin-bottom: 6px;
    }
    .pku-form-group input[type="text"],
    .pku-form-group input[type="password"],
    .pku-form-group input[type="file"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--pku-gray-border);
      border-radius: 4px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .pku-form-group input:focus {
      outline: none;
      border-color: var(--pku-crimson);
      box-shadow: 0 0 0 3px rgba(148,7,10,0.1);
    }
    .pku-btn {
      display: inline-block;
      background: var(--pku-crimson);
      color: var(--pku-white);
      border: none;
      padding: 10px 32px;
      font-size: 15px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .pku-btn:hover { background: var(--pku-crimson-dark); }
    .pku-btn-outline {
      background: var(--pku-white);
      color: var(--pku-crimson);
      border: 1px solid var(--pku-crimson);
    }
    .pku-btn-outline:hover {
      background: var(--pku-crimson);
      color: var(--pku-white);
    }
    /* Alert */
    .pku-alert {
      background: #fef0f0;
      color: var(--pku-crimson);
      border: 1px solid #fbc4c4;
      padding: 10px 16px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    /* Table */
    .pku-table {
      width: 100%;
      border-collapse: collapse;
    }
    .pku-table th {
      background: var(--pku-crimson);
      color: var(--pku-white);
      padding: 12px 16px;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
    }
    .pku-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--pku-gray-border);
      font-size: 14px;
    }
    .pku-table tr:hover td { background: #faf5f5; }
    .pku-table a { color: var(--pku-crimson); text-decoration: none; }
    .pku-table a:hover { text-decoration: underline; }
    .pku-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .pku-badge-teacher { background: #e8f5e9; color: #2e7d32; }
    .pku-badge-student { background: #e3f2fd; color: #1565c0; }
    /* Footer */
    .pku-footer {
      text-align: center;
      padding: 20px;
      color: var(--pku-text-light);
      font-size: 13px;
      border-top: 1px solid var(--pku-gray-border);
      margin-top: 40px;
    }
    .pku-footer a { color: var(--pku-crimson); text-decoration: none; }
    .pku-empty {
      text-align: center;
      padding: 40px;
      color: var(--pku-text-light);
    }
    .pku-link-row {
      display: flex;
      gap: 16px;
      margin-top: 20px;
    }
    .pku-link-row a {
      color: var(--pku-crimson);
      text-decoration: none;
      font-size: 14px;
    }
    .pku-link-row a:hover { text-decoration: underline; }
  </style>
  <script>
    // Shared auth helpers. The JWT lives in localStorage and is attached to
    // every protected request as `Authorization: Bearer <token>`.
    // Defined in <head> so page scripts (which run before the footer) can use it.
    (function () {
      const TOKEN_KEY = 'cc_token';
      const USER_KEY = 'cc_user';

      window.CC = {
        getToken: function () { return localStorage.getItem(TOKEN_KEY); },
        getUser: function () {
          try { return JSON.parse(localStorage.getItem(USER_KEY) || 'null'); }
          catch (e) { return null; }
        },
        setAuth: function (token, user) {
          localStorage.setItem(TOKEN_KEY, token);
          localStorage.setItem(USER_KEY, JSON.stringify(user || {}));
        },
        clearAuth: function () {
          localStorage.removeItem(TOKEN_KEY);
          localStorage.removeItem(USER_KEY);
        },
        requireAuth: function () {
          if (!localStorage.getItem(TOKEN_KEY)) { location.href = '/login'; return false; }
          return true;
        },
        authFetch: function (url, opts) {
          opts = opts || {};
          const headers = Object.assign({}, opts.headers || {});
          const token = localStorage.getItem(TOKEN_KEY);
          if (token) { headers['Authorization'] = 'Bearer ' + token; }
          return fetch(url, Object.assign({}, opts, { headers: headers })).then(function (resp) {
            if (resp.status === 401) {
              CC.clearAuth();
              location.href = '/login';
              throw new Error('unauthorized');
            }
            return resp;
          });
        },
      };
    })();
  </script>
</head>
<body>
  <header class="pku-header">
    <div class="pku-header-top">
      <div class="pku-logo">北</div>
      <div class="pku-title-group">
        <h1>CampusClaw 教研平台</h1>
        <div class="subtitle">北京大学 · 教学材料管理与知识库系统</div>
      </div>
      <nav class="pku-header-nav">
        <a href="/assistant" class="cc-auth-only">解题助手</a>
        <a href="/materials" class="cc-auth-only">材料列表</a>
        <a href="/mcp" class="cc-auth-only">MCP 管理</a>
        <a href="/docs">接口文档</a>
        <span id="cc-nav-user"></span>
        <a href="#" id="cc-logout" class="cc-auth-only">登出</a>
        <a href="/login" id="cc-login-link">登录</a>
      </nav>
    </div>
    <div class="pku-header-bar"></div>
  </header>

  <div class="pku-container">
    {% block content %}{% endblock %}
  </div>

  <footer class="pku-footer">
    CampusClaw &copy; 2026 · Powered by Flask + SQLite + ChromaDB ·
    <a href="/health">Health</a>
  </footer>

  <script>
    // Reflect the auth state in the nav (runs after the DOM exists).
    (function () {
      const user = CC.getUser();
      const signedIn = !!CC.getToken();
      document.querySelectorAll('.cc-auth-only').forEach(function (el) {
        el.style.display = signedIn ? '' : 'none';
      });
      const loginLink = document.getElementById('cc-login-link');
      if (loginLink) { loginLink.style.display = signedIn ? 'none' : ''; }
      const slot = document.getElementById('cc-nav-user');
      if (slot && user) {
        slot.textContent = (user.role === 'teacher' ? '教师' : '学生') +
          (user.username ? ' · ' + user.username : '');
        slot.style.fontSize = '14px';
        slot.style.opacity = '0.9';
      }
      const logout = document.getElementById('cc-logout');
      if (logout) {
        logout.addEventListener('click', function (e) {
          e.preventDefault();
          CC.clearAuth();
          location.href = '/login';
        });
      }
    })();
  </script>
</body>
</html>
