<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>接口文档 · CampusClaw</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='swagger/swagger-ui.css') }}">
  <style>
    body { margin: 0; }
    .topbar { display: none; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="{{ url_for('static', filename='swagger/swagger-ui-bundle.js') }}"></script>
  <script>
    window.addEventListener('load', function () {
      window.ui = SwaggerUIBundle({
        url: '/api/openapi.json',
        dom_id: '#swagger-ui',
        persistAuthorization: true,
        docExpansion: 'none',
      });
    });
  </script>
</body>
</html>
