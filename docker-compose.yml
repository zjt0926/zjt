services:
  app:
    build: .
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/app.db
      UPLOAD_FOLDER: /app/uploads
      VECTOR_DB_PATH: /app/data/chroma
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Self-hosted MCP server (JSON-RPC 2.0 over HTTP). Built from ./mcp-server
  # and started alongside the app so the host can connect to it by service
  # name (http://mcp-server:8090). MCP_AUTH_TOKEN comes from .env and is
  # never baked into the image or committed to Git.
  mcp-server:
    build: ./mcp-server
    expose:
      - "8090"
    env_file:
      - .env
    environment:
      MCP_SERVER_NAME: campus-tools
      MCP_SERVER_VERSION: "1.0.0"
      PORT: "8090"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
